services:
    app:
        image: ${AIMEOS_IMAGE:-ghcr.io/elcreator/aimeos:latest}
        restart: unless-stopped
        ports:
            - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:80"
        environment:
            APP_NAME: Aimeos Demo
            APP_ENV: local
            APP_DEBUG: "false"
            APP_URL: http://localhost:${APP_PORT:-8088}
            APP_VERSION: "3"
            SHOP_MULTILOCALE: "true"
            SHOP_MULTISHOP: "true"
            SHOP_REGISTRATION: "true"
            SHOP_PERMISSION: admin
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_DATABASE: ${DB_DATABASE:-aimeos}
            DB_USERNAME: ${DB_USERNAME:-aimeos}
            DB_PASSWORD: ${DB_PASSWORD:-aimeos_demo_password}
            CACHE_DRIVER: file
            QUEUE_CONNECTION: sync
            SESSION_DRIVER: file
            MAIL_MAILER: smtp
            MAIL_HOST: mailhog
            MAIL_PORT: "1025"
            MAIL_FROM_ADDRESS: shop@example.test
            AIMEOS_ADMIN_EMAIL: ${AIMEOS_ADMIN_EMAIL:-admin@example.com}
            AIMEOS_ADMIN_PASSWORD: ${AIMEOS_ADMIN_PASSWORD:-AimeosDemo2026}
        depends_on:
            mysql:
                condition: service_healthy
            mailhog:
                condition: service_started
        volumes:
            - aimeos-demo-storage:/var/www/html/storage

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-aimeos_demo_password}
            MYSQL_DATABASE: ${DB_DATABASE:-aimeos}
            MYSQL_USER: ${DB_USERNAME:-aimeos}
            MYSQL_PASSWORD: ${DB_PASSWORD:-aimeos_demo_password}
        volumes:
            - aimeos-demo-mysql:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
            interval: 5s
            timeout: 5s
            retries: 20

    mailhog:
        image: mailhog/mailhog:v1.0.1
        restart: unless-stopped
        ports:
            - "${APP_BIND_ADDRESS:-127.0.0.1}:${MAILHOG_SMTP_PORT:-1025}:1025"
            - "${APP_BIND_ADDRESS:-127.0.0.1}:${MAILHOG_UI_PORT:-8025}:8025"

volumes:
    aimeos-demo-mysql:
    aimeos-demo-storage:
